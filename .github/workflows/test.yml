name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          path: derby
      # Racer and Tracks are installed from the folders next to Derby until they are published
      - uses: actions/checkout@v7
        with:
          repository: maggnus/tracks
          ref: modernize
          path: tracks
      - uses: actions/checkout@v7
        with:
          repository: maggnus/racer
          ref: modernize
          path: racer
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
        working-directory: tracks
      - run: npm install
        working-directory: racer
      - run: npm install
        working-directory: derby
      - run: npm run checks
        working-directory: derby
